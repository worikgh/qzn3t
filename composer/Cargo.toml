[package]
name = "composer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.0", features = ["derive"] }
nix = { version = "0.30", features = ["process", "signal"] }
serde_json = "1.0"
ctrlc = "3.4"
which = "4.4"
regex = "1.0"
jack_rec = {path = "../jack_rec/"}
jack = "0.13.3"
[lib]
name = "compose"
path = "src/lib.rs"


[[bin]]
name = "compose"
path = "src/main.rs"
