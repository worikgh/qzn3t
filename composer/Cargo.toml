[package]
name = "composer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.0", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = "3.4"
jack = "0.13.3"
jack_rec = {path = "../jack_rec/"}
nix = { version = "0.30", features = ["process", "signal"] }
regex = "1.0"
serde_json = "1.0"
which = "4.4"
[lib]
name = "compose"
path = "src/lib.rs"


[[bin]]
name = "compose"
path = "src/main.rs"
